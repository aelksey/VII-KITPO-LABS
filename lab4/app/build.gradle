/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 (Jupiter) для модульных и нагрузочных тестов
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'

    // AssertJ Swing для UI-тестирования
    testImplementation 'org.assertj:assertj-swing:3.17.1'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    implementation libs.guava
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()

    // Включаем и жестко настраиваем генерацию HTML-отчетов
    reports {
        html.required = true
    }

    // Заставляем задачу test ВСЕГДА считаться устаревшей, чтобы отчеты перезаписывались
    outputs.upToDateWhen { false } 

    // Настраиваем расширенное логирование, чтобы видеть всё прямо в терминале
    testLogging {
        events "started", "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'Main'
}
